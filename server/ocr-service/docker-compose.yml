services:
  ocr:
    build: .
    container_name: dms-ocr
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
